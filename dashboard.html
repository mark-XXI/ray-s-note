<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ray's Note — Dashboard</title>
<style>
/* Dashboard visual polish — same palette, same data and actions. */
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  color-scheme: dark;
  --bg: #1e1e2e;
  --surface: #2a2a3e;
  --surface2: #33334d;
  --accent: #7c6fff;
  --accent2: #5ac8fa;
  --text: #e0e0f0;
  --text2: #a4a4c1;
  --border: rgba(222,222,255,0.09);
  --danger: #ff6b6b;
  --success: #28c840;
  --warn: #febc2e;
  --radius: 12px;
}
body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  line-height: 1.45;
}
button, input { font: inherit; }
button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent2);
  outline-offset: 2px;
}
#header {
  flex: 0 0 auto;
  background: var(--surface);
  padding: 20px 22px 17px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid var(--border);
}
#header h1 {
  flex: 1;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.35px;
  min-width: 0;
}
#header h1 span { color: #ab9eff; }
#btn-new-dash {
  background: var(--accent);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 9px 14px;
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
  white-space: nowrap;
  transition: background 120ms ease, transform 120ms ease;
}
#btn-new-dash:hover { background: #9288ff; }
#btn-new-dash:active { transform: translateY(1px); }
#stats {
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  padding: 13px 20px 12px;
  background: var(--bg);
}
.stat-box {
  min-width: 0;
  text-align: left;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 11px;
  padding: 11px 10px 10px;
}
.stat-num {
  font-size: 22px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
  color: #a89cff;
}
.stat-lbl {
  font-size: 10px;
  color: var(--text2);
  margin-top: 7px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#filter-bar {
  flex: 0 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 7px 20px 12px;
  background: var(--bg);
}
.ftab {
  color: var(--text2);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 9px;
  cursor: pointer;
  font-size: 11px;
  padding: 6px 12px;
  transition: background 120ms ease, color 120ms ease;
}
.ftab:hover { background: var(--surface2); color: var(--text); }
.ftab.on { background: rgba(124,111,255,0.18); border-color: #8174d2; color: #dad5ff; font-weight: 650; }
#search-row {
  flex: 0 0 auto;
  position: relative;
  background: var(--bg);
  padding: 0 20px 12px;
}
#search-input {
  width: 100%;
  min-width: 0;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 12px;
  padding: 10px 13px 10px 34px;
  outline: none;
  transition: border-color 120ms ease, box-shadow 120ms ease;
}
#search-row::before {
  content: '';
  position: absolute;
  left: 34px;
  top: 11px;
  width: 10px;
  height: 10px;
  border: 1.7px solid var(--text2);
  border-radius: 50%;
  pointer-events: none;
  opacity: 0.8;
}
#search-row::after {
  content: '';
  position: absolute;
  left: 44px;
  top: 24px;
  width: 6px;
  height: 1.5px;
  background: var(--text2);
  transform: rotate(45deg);
  transform-origin: left center;
  pointer-events: none;
  opacity: 0.8;
}
#search-input::placeholder { color: var(--text2); }
#search-input:focus { border-color: #9184f0; box-shadow: 0 0 0 3px rgba(124,111,255,0.14); }
#notes-wrap {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 0 20px 18px;
  scrollbar-gutter: stable;
}
.empty-state {
  color: var(--text2);
  text-align: center;
  font-size: 13px;
  border: 1px dashed rgba(224,224,240,0.15);
  border-radius: 12px;
  padding: 50px 16px;
  background: rgba(255,255,255,0.025);
}
.empty-state div { font-size: 28px; margin-bottom: 10px; }
.note-card {
  display: grid;
  grid-template-columns: 11px minmax(0, 1fr);
  gap: 8px 11px;
  align-items: start;
  padding: 13px 13px 12px;
  margin-bottom: 10px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--surface);
  transition: border-color 120ms ease, background 120ms ease;
  min-width: 0;
}
.note-card:hover { background: #2d2d44; border-color: rgba(195,191,255,0.22); }
.note-card.pinned { border-color: rgba(254,188,46,0.32); }
.note-swatch {
  width: 11px;
  height: 11px;
  border-radius: 4px;
  border: 1px solid rgba(0,0,0,0.18);
  margin-top: 5px;
}
.note-body { min-width: 0; }
.note-preview {
  color: var(--text);
  font-size: 13px;
  font-weight: 550;
  line-height: 1.5;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  margin-bottom: 7px;
}
.note-preview.empty-preview { font-style: italic; color: var(--text2); font-weight: 400; }
.note-meta { color: var(--text2); font-size: 10px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.badge { border-radius: 6px; font-size: 9px; font-weight: 550; padding: 2px 6px; white-space: nowrap; }
.badge-open { background: rgba(40,200,64,0.12); color: #79d68b; }
.badge-hidden { background: rgba(224,224,240,0.08); color: var(--text2); }
.badge-pinned { background: rgba(254,188,46,0.1); color: #efca6d; }
.note-actions {
  display: flex;
  grid-column: 2;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}
.na {
  background: var(--surface2);
  border: 1px solid rgba(255,255,255,0.045);
  color: #c5c5e2;
  border-radius: 7px;
  padding: 5px 10px;
  font-size: 11px;
  cursor: pointer;
  min-height: 28px;
  transition: background 120ms ease, color 120ms ease;
}
.na:hover { background: #41415e; color: #fff; }
.na.show { color: #84d8ff; }
.na.hide { color: #c5c5e2; }
.na.pin { color: #e9cd89; }
.na.del { color: #fa9999; }
.na.del:hover { color: #ffbaba; background: rgba(255,107,107,0.16); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
#footer {
  flex: 0 0 auto;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 10px 14px;
  text-align: center;
  color: var(--text2);
  font-size: 10px;
}
@media (prefers-reduced-motion: reduce) {
  #btn-new-dash, .ftab, .note-card, .na, #search-input { transition: none !important; }
}
::-webkit-scrollbar { width: 7px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(222,222,255,0.16); border-radius: 9px; }
@media (max-width: 430px) {
  #header { padding: 14px; }
  #stats { gap: 5px; padding: 10px 12px; }
  .stat-box { padding: 9px 6px; }
  .stat-lbl { font-size: 9px; }
  #filter-bar { padding: 6px 12px 10px; }
  #search-row { padding: 0 12px 10px; }
  #search-row::before { left: 26px; }
  #search-row::after { left: 36px; }
  #notes-wrap { padding: 0 12px 14px; }
}
</style>
</head>
<body>

<div id="header">
  <h1>Ray's <span>Note</span> - Dashboard</h1>
  <button id="btn-new-dash" type="button" aria-label="Create new note">+ New Note</button>
</div>

<div id="stats">
  <div class="stat-box">
    <div class="stat-num" id="st-total">0</div>
    <div class="stat-lbl">Total Notes</div>
  </div>
  <div class="stat-box">
    <div class="stat-num" id="st-open" style="color:var(--success)">0</div>
    <div class="stat-lbl">On Desktop</div>
  </div>
  <div class="stat-box">
    <div class="stat-num" id="st-hidden" style="color:var(--text2)">0</div>
    <div class="stat-lbl">Hidden</div>
  </div>
  <div class="stat-box">
    <div class="stat-num" id="st-pinned" style="color:var(--warn)">0</div>
    <div class="stat-lbl">Pinned</div>
  </div>
</div>

<div id="filter-bar" role="group" aria-label="Filter notes">
  <button type="button" class="ftab on" data-f="all" aria-pressed="true">All</button>
  <button type="button" class="ftab" data-f="open" aria-pressed="false">On Desktop</button>
  <button type="button" class="ftab" data-f="hidden" aria-pressed="false">Hidden</button>
  <button type="button" class="ftab" data-f="pinned" aria-pressed="false">Pinned</button>
</div>

<div id="search-row">
  <input id="search-input" type="search" aria-label="Search notes" autocomplete="off" placeholder="Search notes..." spellcheck="false">
  <div id="search-count" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
</div>

<div id="notes-wrap" role="region" aria-label="Notes list">
  <div class="empty-state"><div>📋</div>No notes yet — create one!</div>
</div>

<div id="footer">Notes are saved automatically · Ray's Note v1.0</div>

<script src="src/renderer/keyboard.js"></script>
<script src="src/renderer/dashboard.js"></script>
</body>
</html>
