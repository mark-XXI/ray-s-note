<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'none'; connect-src 'none'; font-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ray's Note</title>
<style>
/* ── Reset ── */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--nc, #FFF9C4);
  color: #2c2c2c;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ── Title Bar (drag area) ── */
#titlebar {
  -webkit-app-region: drag;
  background: rgba(0,0,0,0.10);
  padding: 5px 8px 4px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

#win-btns {
  -webkit-app-region: no-drag;
  display: flex;
  gap: 5px;
  align-items: center;
}

.wb {
  width: 16px; height: 16px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 10px;
  line-height: 16px;
  text-align: center;
  color: transparent;
  transition: color 0.15s, transform 0.12s;
  flex-shrink: 0;
  padding: 0;
}
.wb:hover { color: rgba(0,0,0,0.7); transform: scale(1.15); }
#wb-close { background: #ff5f57; }
#wb-hide  { background: #febc2e; }
#wb-new   { background: #28c840; }
#wb-dash  { background: #5ac8fa; font-size: 9px; border-radius: 4px; width: 20px; }

/* ── Color Strip ── */
#color-row {
  -webkit-app-region: no-drag;
  padding: 4px 8px;
  display: flex;
  gap: 5px;
  align-items: center;
  background: rgba(0,0,0,0.05);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  flex-shrink: 0;
}

.cd {
  width: 14px; height: 14px;
  border-radius: 50%;
  border: 1.5px solid rgba(0,0,0,0.18);
  cursor: pointer;
  transition: transform 0.12s;
  flex-shrink: 0;
}
.cd:hover { transform: scale(1.25); }
.cd.on    { border-color: rgba(0,0,0,0.55); transform: scale(1.2); }

/* ── Toolbar ── */
#toolbar {
  -webkit-app-region: no-drag;
  padding: 4px 8px;
  display: flex;
  gap: 3px;
  align-items: center;
  background: rgba(0,0,0,0.04);
  border-bottom: 1px solid rgba(0,0,0,0.08);
  flex-shrink: 0;
  flex-wrap: wrap;
}

.tb {
  background: rgba(0,0,0,0.08);
  border: none;
  border-radius: 4px;
  padding: 2px 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: #333;
  transition: background 0.12s;
  min-width: 24px;
  height: 22px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  user-select: none;
}
.tb:hover { background: rgba(0,0,0,0.18); }
.tb.on    { background: rgba(0,0,0,0.25); }

.sep { width: 1px; height: 16px; background: rgba(0,0,0,0.15); margin: 0 2px; flex-shrink: 0; }

#sz-lbl { font-size: 11px; color: rgba(0,0,0,0.5); min-width: 20px; text-align: center; }

/* ── Editor ── */
#editor {
  flex: 1;
  padding: 10px 12px;
  outline: none;
  font-size: 15px;
  line-height: 1.75;
  color: #2c2c2c;
  overflow-y: auto;
  user-select: text;
  -webkit-app-region: no-drag;
  word-break: break-word;
  cursor: text;
  background: transparent;
  width: 100%;
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
}
#editor:empty::before {
  content: attr(data-ph);
  color: rgba(0,0,0,0.28);
  pointer-events: none;
}

/* ── Tasks ── */
.task-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin: 4px 0;
  padding: 3px 0;
  direction: inherit;
  min-height: 27px;
  -webkit-app-region: no-drag;
}
.task-row input[type=checkbox] {
  width: 17px;
  height: 17px;
  margin: 4px 0 0;
  cursor: pointer;
  flex-shrink: 0;
  accent-color: #4d8060;
  -webkit-app-region: no-drag;
}
.task-text {
  flex: 1;
  min-width: 0;
  min-height: 24px;
  outline: none;
  line-height: 1.5;
  text-align: start;
  overflow-wrap: anywhere;
  user-select: text;
  -webkit-app-region: no-drag;
}
.task-text:empty::before {
  content: attr(data-placeholder);
  color: rgba(0,0,0,0.35);
  pointer-events: none;
}
.task-text:focus-visible { outline: 1px dotted rgba(0,0,0,0.35); outline-offset: 2px; }
.task-text.done {
  text-decoration: line-through;
  color: rgba(0,0,0,0.42);
}

/* ── Status bar ── */
#statusbar {
  -webkit-app-region: no-drag;
  padding: 3px 10px;
  font-size: 10px;
  color: rgba(0,0,0,0.35);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 1px solid rgba(0,0,0,0.07);
  flex-shrink: 0;
  gap: 6px;
}
#save-dot { font-size: 14px; line-height: 1; }

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.18); border-radius: 4px; }
</style>
</head>
<body>

<!-- Title Bar -->
<div id="titlebar">
  <div id="win-btns">
    <button class="wb" id="wb-close"  title="Close">×</button>
    <button class="wb" id="wb-hide"    title="Hide">−</button>
    <button class="wb" id="wb-new"      title="New Note">+</button>
    <button class="wb" id="wb-dash"    title="Dashboard">≡</button>
    <button class="wb" id="wb-toolbar"  title="Toggle Toolbar" style="background:#a0a0a0; border-radius:4px; width:20px; font-size:9px;">▤</button>
  </div>
  <span style="font-size:11px; color:rgba(0,0,0,0.4); -webkit-app-region:drag; flex:1; text-align:center;">Ray's Note</span>
</div>

<!-- Color Strip (separated from titlebar) -->
<div id="color-row">
  <span style="font-size:10px; color:rgba(0,0,0,0.4); margin-left:2px;">Color:</span>
  <div class="cd" style="background:#FFF9C4" data-c="#FFF9C4"  title="Yellow"></div>
  <div class="cd" style="background:#C8F7C5" data-c="#C8F7C5"  title="Green"></div>
  <div class="cd" style="background:#C5E8FF" data-c="#C5E8FF"  title="Blue"></div>
  <div class="cd" style="background:#FFC5C5" data-c="#FFC5C5"  title="Pink"></div>
  <div class="cd" style="background:#E8C5FF" data-c="#E8C5FF"  title="Purple"></div>
  <div class="cd" style="background:#FFE0C5" data-c="#FFE0C5"  title="Orange"></div>
  <div class="cd" style="background:#F0F0F0" data-c="#F0F0F0"  title="White"></div>
</div>

<!-- Toolbar -->
<div id="toolbar">
  <!-- Text format -->
  <button class="tb" data-format="bold"      title="Bold"><b>B</b></button>
  <button class="tb" data-format="italic"    title="Italic"><i>I</i></button>
  <button class="tb" data-format="underline" title="Underline"><u>U</u></button>
  <div class="sep"></div>
  <!-- Alignment -->
  <button class="tb" data-align="left"   title="Align Left">◀≡</button>
  <button class="tb" data-align="center" title="Center">≡</button>
  <button class="tb" data-align="right"  title="Align Right">≡▶</button>
  <div class="sep"></div>
  <!-- Direction -->
  <button class="tb" data-direction="ltr" title="Left to Right (English)">LTR</button>
  <button class="tb" data-direction="rtl" title="Right to Left (Arabic)">RTL</button>
  <div class="sep"></div>
  <!-- Insert -->
  <button class="tb" data-command="bullet" title="Bullet Point">•</button>
  <button class="tb" data-command="task"   title="Task / Checkbox">☐</button>
  <div class="sep"></div>
  <!-- Font size -->
  <button class="tb" data-font-delta="-1" title="Decrease Font">A-</button>
  <span id="sz-lbl">15</span>
  <button class="tb" data-font-delta="1"  title="Increase Font">A+</button>
</div>

<!-- Editor -->
<div id="editor"
     contenteditable="true"
     spellcheck="false"
     data-ph="Start typing...">
</div>

<!-- Status Bar -->
<div id="statusbar">
  <span id="wc">0 words</span>
  <span id="save-dot" title="Saved">●</span>
  <span id="save-lbl">Saved</span>
</div>

<script src="src/renderer/note-html.js"></script>
<script src="src/renderer/note-tasks.js"></script>
<script src="src/renderer/note.js"></script>
</body>
</html>
